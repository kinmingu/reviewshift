# React 정적 파일 + API 프록시(챗봇 답변은 CPU에서 몇 분 걸릴 수 있어 시간 제한을 넉넉히 둡니다)
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    # 새로고침해도 /products/... 주소가 React 라우터로 가게 합니다.
    location / {
        try_files $uri /index.html;
    }
}
